# QQ 群早报配置（RSS + 浙江在线官方浙江宣传栏目，无 AI）
# 总上限 12 条；按来源顺序分配配额。
# source.count 为该源的最多条数；新闻不足时不使用旧新闻凑数。
# 每个源可用 MORNINGPAPER_<ID>_ENABLED / COUNT 覆盖 enabled / count。

schedule:
  time: "08:00"                 # 可用 .env.prod 的 MORNINGPAPER_TIME 覆盖
  timezone: "Asia/Shanghai"

fetch:
  lookback_hours: 24
  timeout_seconds: 10
  retry_times: 2
  user_agent: "Mozilla/5.0 (compatible; MorningNewsBot/1.0)"

filter:
  sort_by: "published_desc"       # 优先最新发布的文章
  deduplicate_url: true           # 相同链接去重
  deduplicate_title: true         # 相同标题去重（仅完全相同）
  exclude_keywords:
    - "广告"
    - "优惠券"
    - "限时抢购"
    - "促销"

output:
  title: "今日早报"
  max_items: 12
  show_category: false
  show_lunar: true
  show_source: true
  show_link: true
  use_rss_description: false     # 仅输出原标题、来源和原文链接
  ai_enabled: false              # 不调用任何 AI 模型
  allow_old_news_to_fill: false  # 无新闻时保留空缺，不跨天补位

sources:
  - id: zhejiang
    name: "浙江宣传（浙江在线转载）"
    category: "浙江宣传"
    type: zjol
    enabled: true
    count: 1
    url: "https://zjnews.zjol.com.cn/zjxc/"

  - id: domestic
    name: "中国新闻网·时政"
    category: "国内要闻"
    enabled: true
    count: 2
    url: "https://www.chinanews.com.cn/rss/china.xml"

  - id: society
    name: "中国新闻网·社会"
    category: "国内社会"
    enabled: true
    count: 1
    url: "https://www.chinanews.com.cn/rss/society.xml"

  - id: finance
    name: "中国新闻网·财经"
    category: "财经要闻"
    enabled: true
    count: 1
    url: "https://www.chinanews.com.cn/rss/finance.xml"

  - id: world
